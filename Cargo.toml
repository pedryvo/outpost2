[package]
name = "outpost2"
version = "0.1.0"
edition = "2021"
authors = ["Pedro Ivo Rocha <pedryvo@gmail.com>"]
description = "Reverse engineering and modern web port (Rust, WebAssembly & HTML5 Canvas) of Sierra's 1997 Outpost 2: Divided Destiny."
license = "GPL-3.0-or-later"
repository = "https://github.com/pedryvo/outpost2"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
console_error_panic_hook = "0.1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"

[dependencies.web-sys]
version = "0.3.77"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "ImageData",
  "Performance",
  "MouseEvent",
  "KeyboardEvent",
  "TouchEvent",
  "TouchList",
  "Touch",
  "AudioContext",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioParam",
  "OscillatorNode",
  "OscillatorType",
  "GainNode",
  "AudioDestinationNode",
  "Response",
  "Headers",
  "Request",
  "RequestInit",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
